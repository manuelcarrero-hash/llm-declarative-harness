schema_version: "1.2"
harness:
  name: "Arnés declarativo agnóstico para LLMs"
  version: "0.7.0"
  languages: ["es", "en"]
  canonical_language: "es"
  translations:
    es_entrypoint: "INTERNO_PARA_LLM.md"
    en_entrypoint: "en/LLM_INTERNALS.md"
    policy: "semantic parity"
    parity_matrix: "PARIDAD_BILINGUE.md"
  author: "Manuel Carrero Rojo"
  license: "MIT"
  copyright: "Copyright (c) 2026 Manuel Carrero Rojo"
  attribution: "Arnés declarativo agnóstico para LLMs, creado por Manuel Carrero Rojo."
  runtime: "declarative"
  provider_neutral: true

human_entrypoint: "EMPEZAR_AQUI.md"
entrypoint: "INTERNO_PARA_LLM.md"

distribution:
  canonical_source: "https://github.com/manuelcarrero-hash/llm-declarative-harness"
  canonical_ref: "main"
  drive_role: "mirror"
  sync_rule: "Toda réplica debe conservar la misma versión y paridad semántica; ante divergencia, usar la fuente canónica."

guided_start:
  path: "01_nucleo/INICIO_GUIADO.md"
  modes: [NEW, RESUME, VERIFY]
  capability_profile: "04_adaptadores/PERFIL_CAPACIDADES.template.yaml"
  rule: "El agente traduce lenguaje natural al contrato; el usuario no configura archivos técnicos ni selecciona módulos."
  universal_prompt: "EMPEZAR_AQUI.md"
  load_receipt: "03_plantillas/COMPROBANTE_CARGA.template.md"
  load_gate: "Confirmar versión y fuente antes de preguntar; tras las aclaraciones mínimas, presentar el comprobante completo antes de cualquier modificación o acción material. Si la lectura no puede demostrarse, detenerse con la acción manual mínima."

invariants:
  - "No afirmar capacidades no verificadas."
  - "No ampliar autoridad por persistencia, autonomía o delegación."
  - "No declarar terminado sin evidencia de todos los criterios obligatorios."
  - "Separar reglas durables, estado actual, tarea y handoff."
  - "Preservar trabajo ajeno y distinguir implementado, validado y desplegado."
  - "No tratar consenso, mayoría o repetición como sustituto de evidencia."

capability_labels: [SUPPORTED, PARTIAL, UNSUPPORTED, UNKNOWN]
authorization_labels: [NOT_REQUIRED, REQUIRED, GRANTED, DENIED, UNKNOWN]
terminal_states: [ACHIEVED, BLOCKED_EXTERNAL, DECISION_REQUIRED, AUTHORITY_REQUIRED]

modules:
  - id: goal
    path: "02_modulos/OBJETIVO.md"
    activate_when: "trabajo sustancial con resultado verificable"
  - id: iteration
    path: "02_modulos/ITERACION.md"
    activate_when: "varios intentos reversibles pueden compararse contra una validación estable"
  - id: governance
    path: "02_modulos/GOBERNANZA.md"
    activate_when: "existen o se requieren reglas para agentes"
  - id: team
    path: "02_modulos/EQUIPO.md"
    activate_when: "existen frentes independientes y el beneficio de roles separados justifica coordinación y costo"
  - id: status
    path: "02_modulos/ESTADO_PROYECTO.md"
    activate_when: "se consulta, reanuda o sincroniza un proyecto"
  - id: continuity
    path: "02_modulos/CONTINUIDAD.md"
    activate_when: "el trabajo cruza sesiones, agentes, compactación o fases"
  - id: evaluator
    path: "02_modulos/EVALUADOR.md"
    activate_when: "se mide una ejecución real o la madurez del arnés"
  - id: council
    path: "02_modulos/CONSEJO.md"
    activate_when: "una decisión ambigua, costosa o subjetiva mejora con perspectivas independientes"

templates:
  load_receipt: "03_plantillas/COMPROBANTE_CARGA.template.md"
  startup_summary: "03_plantillas/RESUMEN_ARRANQUE.template.md"
  goal: "03_plantillas/CONTRATO_OBJETIVO.template.md"
  governance: "03_plantillas/AGENTS.template.md"
  agent_assignment: "03_plantillas/ASIGNACION_AGENTE.template.md"
  orchestration_trace: "03_plantillas/TRAZA_ORQUESTACION.template.md"
  work_map: "03_plantillas/MAPA_TRABAJO.template.md"
  iteration_log: "03_plantillas/REGISTRO_ITERACIONES.template.md"
  status: "03_plantillas/PROJECT_STATUS.template.md"
  operational_pulse: "03_plantillas/PULSO_OPERATIVO.template.md"
  handoff: "03_plantillas/HANDOFF.template.md"
  evaluation: "03_plantillas/EVALUACION.template.json"
  capabilities: "04_adaptadores/PERFIL_CAPACIDADES.template.yaml"
  council_brief: "03_plantillas/EXPEDIENTE_CONSEJO.template.md"

validation:
  conformance: "06_validacion/PRUEBA_DE_CONFORMIDAD.md"
  control_catalog: "06_validacion/CATALOGO_DE_CONTROLES.md"
  regression_suite: "06_validacion/SUITE_REGRESION.md"
  release_regression_cases: [13, 20]
  minimum_real_runs: 3
  stronger_decision_sample: 5

examples:
  software: "05_ejemplos/BOOTSTRAP_PROYECTO.md"
  non_code: "05_ejemplos/BOOTSTRAP_NO_CODIGO.md"
  guided_start: "05_ejemplos/ESCENARIOS_INICIO_GUIADO.md"
  non_technical_user_acceptance_cases: "05_ejemplos/CASOS_ACEPTACION_USUARIO_NO_TECNICO.md"
