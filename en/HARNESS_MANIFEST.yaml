schema_version: "1.2"
harness:
  name: "Provider-Neutral Declarative Harness for LLMs"
  version: "0.9.0"
  languages: ["es", "en"]
  canonical_language: "es"
  translations:
    es_entrypoint: "../INTERNO_PARA_LLM.md"
    en_entrypoint: "LLM_INTERNALS.md"
    policy: "semantic parity"
    parity_matrix: "BILINGUAL_PARITY.md"
  author: "Manuel Carrero Rojo"
  license: "MIT"
  provider_neutral: true

human_entrypoint: "START_HERE.md"
entrypoint: "LLM_INTERNALS.md"

distribution:
  canonical_source: "https://github.com/manuelcarrero-hash/llm-declarative-harness"
  canonical_ref: "main"
  drive_role: "mirror"
  sync_rule: "Every mirror must preserve the same version and semantic parity; on divergence, use the canonical source."

guided_start:
  path: "01_core/GUIDED_START.md"
  modes: [NEW, RESUME, VERIFY]
  capability_profile: "04_adapters/CAPABILITY_PROFILE.template.yaml"
  rule: "The agent translates natural language into the contract; the user does not configure technical files or select modules."
  universal_prompt: "START_HERE.md"
  load_receipt: "03_templates/LOAD_RECEIPT.template.md"
  load_gate: "Confirm version and source before asking; after minimum clarifications, present the complete receipt before any modification or material action. If reading cannot be demonstrated, stop with the smallest manual action."
invariants:
  - "Do not claim unverified capabilities."
  - "Persistence, autonomy and delegation do not expand authority."
  - "Do not declare completion without evidence for every mandatory criterion."
  - "Keep durable rules, current state, tasks and handoffs separate."
  - "Preserve other people's work and distinguish implemented, validated and deployed."
  - "Do not treat consensus, majority or repetition as a substitute for evidence."
  - "Do not silently choose a material decision the user left ambiguous."
  - "Do not produce or store as fact a material premise that is unconfirmed or unsupported."
  - "Do not offset a failed mandatory criterion with global approval or unrelated strengths."
  - "Do not call a Reviewer adjustment calibrated without another relevant run and no material regressions."
capability_labels: [SUPPORTED, PARTIAL, UNSUPPORTED, UNKNOWN]
authorization_labels: [NOT_REQUIRED, REQUIRED, GRANTED, DENIED, UNKNOWN]
terminal_states: [ACHIEVED, BLOCKED_EXTERNAL, DECISION_REQUIRED, AUTHORITY_REQUIRED]
modules:
  - id: goal
    path: "02_modules/GOAL.md"
    activate_when: "substantial work with a verifiable outcome"
  - id: iteration
    path: "02_modules/ITERATION.md"
    activate_when: "several reversible attempts can be compared against stable validation"
  - id: governance
    path: "02_modules/GOVERNANCE.md"
    activate_when: "agent rules exist or are required"
  - id: team
    path: "02_modules/TEAM.md"
    activate_when: "independent workstreams exist and the benefit of separated roles justifies coordination and cost"
  - id: status
    path: "02_modules/PROJECT_STATUS.md"
    activate_when: "a project is queried, resumed or synchronized"
  - id: continuity
    path: "02_modules/CONTINUITY.md"
    activate_when: "work crosses sessions, agents, compaction or phases"
  - id: evaluator
    path: "02_modules/EVALUATOR.md"
    activate_when: "a real run or harness maturity is measured"
  - id: council
    path: "02_modules/COUNCIL.md"
    activate_when: "an ambiguous, costly or subjective decision benefits from independent perspectives"
templates:
  load_receipt: "03_templates/LOAD_RECEIPT.template.md"
  startup_summary: "03_templates/STARTUP_SUMMARY.template.md"
  goal: "03_templates/GOAL_CONTRACT.template.md"
  governance: "03_templates/AGENTS.template.md"
  agent_assignment: "03_templates/AGENT_ASSIGNMENT.template.md"
  orchestration_trace: "03_templates/ORCHESTRATION_TRACE.template.md"
  work_map: "03_templates/WORK_MAP.template.md"
  iteration_log: "03_templates/ITERATION_LOG.template.md"
  status: "03_templates/PROJECT_STATUS.template.md"
  operational_pulse: "03_templates/OPERATIONAL_PULSE.template.md"
  handoff: "03_templates/HANDOFF.template.md"
  evaluation: "03_templates/EVALUATION.template.json"
  reviewer_calibration: "03_templates/REVIEWER_CALIBRATION.template.md"
  capabilities: "04_adapters/CAPABILITY_PROFILE.template.yaml"
  council_brief: "03_templates/COUNCIL_BRIEF.template.md"
validation:
  conformance: "06_validation/CONFORMANCE_TEST.md"
  control_catalog: "06_validation/CONTROL_CATALOG.md"
  regression_suite: "06_validation/REGRESSION_SUITE.md"
  release_regression_cases: [20, 20]
  minimum_real_runs: 3
  stronger_decision_sample: 5

examples:
  software: "05_examples/PROJECT_BOOTSTRAP.md"
  non_code: "05_examples/NON_CODE_BOOTSTRAP.md"
  guided_start: "05_examples/GUIDED_START_SCENARIOS.md"
  non_technical_user_acceptance_cases: "05_examples/NON_TECHNICAL_USER_ACCEPTANCE_CASES.md"
